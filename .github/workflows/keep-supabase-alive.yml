# Keep Supabase database active to prevent auto-pausing on free tier
# Supabase pauses inactive databases after 7 days on free tier
name: Keep Supabase Alive

on:
  # Run daily at midnight UTC
  schedule:
    - cron: '0 0 * * *'

  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase Database
        run: |
          # Execute actual SELECT query to ensure database activity
          response=$(curl -s -w "\n%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/pint_entries?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response body: $body"
          echo "HTTP status: $http_code"

          if [ "$http_code" -eq 200 ]; then
            echo "Successfully queried Supabase database"
          else
            echo "Failed to query Supabase database"
            exit 1
          fi
