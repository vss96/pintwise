# Keep Supabase database active to prevent auto-pausing on free tier
# Supabase pauses inactive databases after 7 days on free tier
name: Keep Supabase Alive

on:
  # Run every 5 days at midnight UTC
  schedule:
    - cron: '0 0 * * *'  

  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/pint_entries?select=count&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          if [ "$response" -eq 200 ]; then
            echo "Successfully pinged Supabase database (HTTP $response)"
          else
            echo "Failed to ping Supabase database (HTTP $response)"
            exit 1
          fi
